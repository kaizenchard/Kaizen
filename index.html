<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIZEN AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: comic sans ms;
        }

        body {

            height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(-180deg, indigo, gold,purple);
            background-size: 400% 400%;
            animation: bg 10s ease infinite;

            overflow: hidden;

        }

        @keyframes bg {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }

        .chat {

            width: 90%;
            max-width: 900px;
            height: 90vh;
            display: flex;
            flex-direction: column;

            backdrop-filter: blur(18px);

            position: relative;

        }

        .header {

            padding: 5px;
            font-size: 28px;
            font-weight: bold;
            color: red;

            text-align: center;

        }

        .messages {

            flex: 1;
            overflow: auto;

            padding: 20px;

            display: flex;
            flex-direction: column;
            gap: 15px;

            scrollbar-width: none;

        }

        .messages::-webkit-scrollbar {

            width: 0;
            height: 0;

        }

        .user {

            align-self: flex-end;

            background: #ffffff16;

            padding: 15px 20px;

            font-size: 12;

            font: bold;

            border-radius: 20px;

            color: black;

            max-width: 70%;

            white-space: pre-wrap;
            overflow-wrap: anywhere;

        }

        .ai {

            align-self: flex-start;

            background: #ffffff18;

            padding: 15px 20px;

            border-radius: 20px;

            color: black;

            max-width: 70%;

            line-height: 1.4;

            animation: fade .4s ease;

            white-space: pre-wrap;
            overflow-wrap: anywhere;

        }

        @keyframes fade {

            from {

                opacity: 0;
                transform: translateY(20px);

            }

            to {

                opacity: 1;
                transform: translateY(0);

            }

        }

        .inputArea {

            display: flex;
            padding: 20px;
            gap: 10px;

        }

        input {

            flex: 1;

            padding: 18px;
            width: 10px;
            border: none;

            outline: none;

            border-radius: 50px;

            font-size: 16px;

            background: transparent;

        }

        input:hover {
            background: white;

            transform: scale(0.93);
            transition: 2s ease;
        }



        button {

            padding: 18px 30px;

            border: none;

            border-radius: 50px;

            cursor: pointer;

            background: #0ffff5;

            font-size: 16px;

            font-weight: bold;

            transition: .3s;

        }

        button:hover {
            background: greenyellow;
            transform: scale(1.05);
            transition: 1s ease;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .typing {

            display: inline-block;
            border-right: 2px solid white;
            animation: blink .6s infinite;

        }

        @keyframes blink {

            50% {
                border-color: transparent;
            }

        }

        /* ---- Floating scroll control ---- */
        .scroll-control {

            position: absolute;
            right: 8px;
            top: 76%;
            transform: translateY(-50%);

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;

            padding: 1px;

            border-radius: 99px;

            background: transparent;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.12);

            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);

            opacity: 0.45;

            transition: opacity .25s ease, transform .25s ease;

            z-index: 999;

        }

        .scroll-control:hover {

            opacity: 1;

        }

        .scroll-btn {

            width: 12px;
            height: 12px;

            border: none;

            border-radius: 50%;

            background: transparent;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition: transform .15s ease;

            -webkit-tap-highlight-color: transparent;

            outline: none;

        }

        .scroll-btn:hover {

            background: transparent;

        }

        .scroll-btn:active {

            transform: scale(0.9);

        }

        .scroll-btn:focus {

            outline: none;

        }

        .scroll-btn svg {

            width: 11px;
            height: 11px;

            stroke: white;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;

        }

        .scroll-divider {

            width: 19px;
            height: 3px;

            background: rgba(255, 255, 255, 0.15);

        }

        .scroll-btn[disabled] {

            opacity: 0.25;
            cursor: default;

        }

        .scroll-btn[disabled]:hover {

            background: transparent;

        }
    </style>

</head>

<body>


    <div class="chat">

        <div class="header">
            ௹KAIZEN
        </div>

        <div class="messages" id="messages">

            <div class="ai">
                Hello 👋 I'm KAIZEN .<br><br>
                Ask me anything!
            </div>

        </div>

        <div class="scroll-control">
            <button class="scroll-btn" id="scrollUp" aria-label="Scroll up">
                <svg viewBox="0 0 24 24">
                    <path d="M18 15l-6-6-6 6" />
                </svg>
            </button>
            <div class="scroll-divider"></div>
            <button class="scroll-btn" id="scrollDown" aria-label="Scroll down">
                <svg viewBox="0 0 24 24">
                    <path d="M6 9l6 6 6-6" />
                </svg>
            </button>
        </div>

        <div class="inputArea">

            <input id="input" placeholder="chat with Kaizen😇...">

            <button id="sendBtn" onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

    <script>

        const messages = document.getElementById("messages");
        const input = document.getElementById("input");
        const sendBtn = document.getElementById("sendBtn");

        // Conversation history sent to the backend so KAIZEN remembers context.
        // The API key is NOT here: it lives in a Netlify environment variable.
        const history = [];
        let busy = false;

        async function getReply() {
            try {
                const r = await fetch("/.netlify/functions/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: history })
                });
                const d = await r.json();
                if (!r.ok) return d.error || "Something went wrong. Try again.";
                return d.reply;
            } catch (e) {
                return "Can't reach the server. Check your internet and try again.";
            }
        }

        async function sendMessage() {

            const text = input.value.trim();

            if (text === "" || busy) return;

            busy = true;
            sendBtn.disabled = true;

            const user = document.createElement("div");
            user.className = "user";
            user.textContent = text;
            messages.appendChild(user);

            input.value = "";
            messages.scrollTop = messages.scrollHeight;

            history.push({ role: "user", content: text });

            // AI bubble with blinking cursor while we wait for the reply
            const ai = document.createElement("div");
            ai.className = "ai";
            ai.innerHTML = "<span class='typing'></span>";
            messages.appendChild(ai);
            messages.scrollTop = messages.scrollHeight;

            const reply = await getReply();

            history.push({ role: "assistant", content: reply });

            type(ai, reply, () => {
                busy = false;
                sendBtn.disabled = false;
                input.focus();
            });

        }

        function type(element, text, done) {

            let i = 0;

            const interval = setInterval(() => {

                element.textContent = text.substring(0, i);

                const cursor = document.createElement("span");
                cursor.className = "typing";
                element.appendChild(cursor);

                i++;

                messages.scrollTop = messages.scrollHeight;

                if (i > text.length) {

                    clearInterval(interval);

                    element.textContent = text;

                    messages.scrollTop = messages.scrollHeight;

                    if (done) done();

                }

            }, 15);

        }

        input.addEventListener("keypress", function (e) {

            if (e.key === "Enter") sendMessage();

        });

        const upBtn = document.getElementById("scrollUp");
        const downBtn = document.getElementById("scrollDown");
        const scrollStep = 200;

        upBtn.addEventListener("click", () => {

            messages.scrollBy({ top: -scrollStep, behavior: "smooth" });

        });

        downBtn.addEventListener("click", () => {

            messages.scrollBy({ top: scrollStep, behavior: "smooth" });

        });

        function updateScrollButtons() {

            const atTop = messages.scrollTop <= 0;

            const atBottom = messages.scrollTop + messages.clientHeight >= messages.scrollHeight - 1;

            upBtn.disabled = atTop;

            downBtn.disabled = atBottom;

        }

        messages.addEventListener("scroll", updateScrollButtons);

        updateScrollButtons();
        

    </script>
    

</body>

</html>
